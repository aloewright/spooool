name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile is Linux-canonical
        run: npm install --package-lock-only && git diff --exit-code package-lock.json

      - name: Lint
        run: npm run lint

      - name: Lint no direct AI providers
        run: npm run lint:no-providers

      - name: Type check
        run: npm run type-check

      - name: Test (unit)
        run: npx vitest --passWithNoTests --run

      - name: Build
        run: npm run build

      - name: Test (workers)
        run: npx vitest --config vitest.workers.config.ts --passWithNoTests --run
