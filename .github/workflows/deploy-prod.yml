name: Deploy · production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (commit SHA, tag, or branch) to deploy
        required: true
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  staging-smoke:
    name: Staging health gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ALO-126: prod deploy waits until staging /api/health says "ok".
      # The URL is overridable via the STAGING_HEALTH_URL repo variable so
      # forks / preview environments can point this at their own staging.
      - name: Probe staging /api/health
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || 'https://staging.spooool.com/api/health' }}
        run: |
          set -euo pipefail
          echo "Probing $STAGING_HEALTH_URL"
          # Up to 5 attempts, 10s apart — handles a deploy in flight.
          for i in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 "$STAGING_HEALTH_URL" || true)
            status=$(echo "$body" | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$status" = "ok" ]; then
              echo "Staging healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i: status='$status' body='$body'"
            sleep 10
          done
          echo "::error ::Staging is not healthy — refusing to deploy production. Fix staging first or override STAGING_HEALTH_URL."
          exit 1

  deploy:
    name: Wrangler deploy (production)
    needs: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: |
          npm run lint
          npm run type-check
          npm test -- --run

      # ALO-166: prod secrets pulled from the Doppler v3 REST API —
      # DOPPLER_TOKEN_PROD is a service token scoped to spooool/production.
      # Hard fail when missing; prod can't deploy without secrets.
      - name: Check Doppler credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error ::Production deploy requires DOPPLER_TOKEN_PROD secret (Doppler service token scoped to spooool/production)."
            exit 1
          fi

      - name: Hydrate VITE_* vars from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: node scripts/sync-doppler-secrets.mjs write-build-env

      - name: Build frontend
        run: npm run build

      - name: Sync worker secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: node scripts/sync-doppler-secrets.mjs sync-worker-secrets --env=production

      - name: Deploy worker (production)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          eval "$(node scripts/sync-doppler-secrets.mjs print-cloudflare-env)"
          npx wrangler deploy --env production
