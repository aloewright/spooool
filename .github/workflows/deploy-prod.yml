name: Deploy · production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (commit SHA, tag, or branch) to deploy
        required: true
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Wrangler deploy (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: |
          npm run lint
          npm run type-check
          npm test -- --run

      # ALO-166: prod secrets sourced from Doppler. DOPPLER_TOKEN_PROD must
      # be set as a repo secret, scoped to the spooool/production config.
      # Unlike staging this is a hard fail — prod can't deploy without
      # secrets configured.
      - name: Check Doppler credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error ::Production deploy requires DOPPLER_TOKEN_PROD secret (Doppler service token scoped to spooool/production)."
            exit 1
          fi

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Build frontend (with Doppler-injected VITE_* vars)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: doppler run -- npm run build

      - name: Deploy worker (production) via Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: doppler run -- npx wrangler deploy --env production
