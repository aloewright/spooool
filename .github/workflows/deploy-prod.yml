name: Deploy · production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (commit SHA, tag, or branch) to deploy
        required: true
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Wrangler deploy (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check out
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: |
          npm run lint
          npm run type-check
          npm test -- --run

      # ALO-166: prod secrets pulled from the Doppler v3 REST API —
      # DOPPLER_TOKEN_PROD is a service token scoped to spooool/production.
      # Hard fail when missing; prod can't deploy without secrets.
      - name: Check Doppler credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error ::Production deploy requires DOPPLER_TOKEN_PROD secret (Doppler service token scoped to spooool/production)."
            exit 1
          fi

      - name: Hydrate VITE_* vars from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: node scripts/sync-doppler-secrets.mjs write-build-env

      - name: Build frontend
        run: npm run build

      # Deploy BEFORE syncing secrets. The Workers Builds CI integration uploads
      # new (undeployed) Worker *versions* on every push, so by deploy time the
      # "latest version" usually isn't the deployed one. Cloudflare then rejects
      # `wrangler secret bulk` with code 10215 ("the latest version isn't
      # currently deployed"). Running `wrangler deploy` first makes latest ==
      # deployed, after which the secret sync is allowed. Secrets already on the
      # worker carry the previous deploy, so deploying first never runs secretless.
      - name: Deploy worker (production)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          eval "$(node scripts/sync-doppler-secrets.mjs print-cloudflare-env)"
          npx wrangler deploy

      - name: Sync worker secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          eval "$(node scripts/sync-doppler-secrets.mjs print-cloudflare-env)"
          node scripts/sync-doppler-secrets.mjs sync-worker-secrets
