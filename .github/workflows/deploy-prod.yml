name: Deploy · production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (commit SHA, tag, or branch) to deploy
        required: true
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Wrangler deploy (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: |
          npm run lint
          npm run type-check
          npm test -- --run

      # ALO-166: prod secrets pulled from the Doppler v3 REST API —
      # DOPPLER_TOKEN_PROD is a service token scoped to spooool/production.
      # Hard fail when missing; prod can't deploy without secrets.
      - name: Check Doppler credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error ::Production deploy requires DOPPLER_TOKEN_PROD secret (Doppler service token scoped to spooool/production)."
            exit 1
          fi

      - name: Hydrate VITE_* vars from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: node scripts/sync-doppler-secrets.mjs write-build-env

      - name: Build frontend
        run: npm run build

      - name: Sync worker secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: node scripts/sync-doppler-secrets.mjs sync-worker-secrets --env=production

      - name: Deploy worker (production)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          eval "$(node scripts/sync-doppler-secrets.mjs print-cloudflare-env)"
          npx wrangler deploy --env production
