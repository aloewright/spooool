name: Deploy · staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Wrangler deploy (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: |
          npm run lint
          npm run type-check
          npm test -- --run

      # ALO-166: secrets are pulled directly from the Doppler v3 REST API by
      # scripts/sync-doppler-secrets.mjs — no Doppler CLI installed at
      # deploy time. DOPPLER_TOKEN_STAGING is a service token scoped to the
      # quickapp/staging config; if it's missing the build still runs
      # (without VITE_*) and the deploy is skipped — keeps unprovisioned
      # forks green. `secrets.*` can't be referenced in step-level `if:`
      # expressions, so we project it through a step output.
      - name: Check Doppler credentials
        id: creds
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::DOPPLER_TOKEN_STAGING missing — skipping wrangler deploy."
          fi

      # The build needs VITE_* baked into the bundle — pull them from
      # Doppler into a .env.production.local file Vite picks up automatically.
      - name: Hydrate VITE_* vars from Doppler
        if: steps.creds.outputs.configured == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: node scripts/sync-doppler-secrets.mjs write-build-env

      - name: Build frontend
        run: |
          if [ ! -f .env.production.local ]; then
            echo "::warning ::No .env.production.local — building without VITE_SENTRY_DSN / VITE_POSTHOG_KEY"
          fi
          npm run build

      # Sync any non-VITE / non-CF secrets from Doppler into the worker's
      # secret store. Idempotent: re-running with the same values is a no-op.
      - name: Sync worker secrets from Doppler
        if: steps.creds.outputs.configured == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: node scripts/sync-doppler-secrets.mjs sync-worker-secrets --env=staging

      - name: Deploy worker (staging)
        if: steps.creds.outputs.configured == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          eval "$(node scripts/sync-doppler-secrets.mjs print-cloudflare-env)"
          npx wrangler deploy --env staging
