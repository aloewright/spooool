name: Deploy · staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Wrangler deploy (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: |
          npm run lint
          npm run type-check
          npm test -- --run

      # Quality gates above don't need secrets; the build does so it can
      # bake VITE_SENTRY_DSN / VITE_POSTHOG_KEY into the bundle.
      - name: Install Doppler CLI (build env)
        if: ${{ secrets.DOPPLER_TOKEN_STAGING != '' }}
        uses: dopplerhq/cli-action@v3

      - name: Build frontend (with Doppler-injected VITE_* vars)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            doppler run -- npm run build
          else
            echo "::warning ::No DOPPLER_TOKEN_STAGING — building without VITE_SENTRY_DSN / VITE_POSTHOG_KEY"
            npm run build
          fi

      # ALO-166: secrets are sourced from Doppler — set DOPPLER_TOKEN as a
      # repo secret with read access to the spooool/staging config. The
      # token can be a per-environment service token (rotates independently)
      # or the org service-token. The workflow stays green if DOPPLER_TOKEN
      # is missing — useful while the Doppler workspace is being set up —
      # but emits a warning so we notice.
      - name: Check Doppler credentials
        id: creds
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::DOPPLER_TOKEN_STAGING missing — skipping wrangler deploy. Set it in repo Secrets, scoped to spooool/staging in Doppler."
          fi

      - name: Install Doppler CLI
        if: steps.creds.outputs.configured == 'true'
        uses: dopplerhq/cli-action@v3

      - name: Deploy worker (staging) via Doppler
        if: steps.creds.outputs.configured == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        # `doppler run` injects every secret from the bound config (project +
        # config name come from doppler.yaml) into the wrangler environment.
        # wrangler-action would clobber that env, so we invoke wrangler
        # directly inside the doppler shell.
        run: doppler run -- npx wrangler deploy --env staging
