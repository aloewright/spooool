<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spooool — a video host that respects your time</title>
    <meta
      name="description"
      content="A fast, ad-free video host built on Cloudflare. Drop in a clip, get a shareable link in seconds. Free tier with 1 GB storage."
    />
    <meta name="theme-color" content="#0b0b0b" />
    <meta property="og:title" content="spooool — a video host that respects your time" />
    <meta
      property="og:description"
      content="Upload, stream, share — no friction. Edge-streamed video on Cloudflare."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spooool.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="spooool — a video host that respects your time" />
    <meta
      name="twitter:description"
      content="Upload, stream, share — no friction. Edge-streamed video on Cloudflare."
    />
    <link rel="canonical" href="https://spooool.com/" />
    <link rel="preconnect" href="https://videodelivery.net" crossorigin />
    <link rel="dns-prefetch" href="https://videodelivery.net" />
    <link rel="preload" href="/fonts/Nunito-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/frontend/main.tsx"></script>
  </body>
</html>
