<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spooool</title>
    <!-- Cloudflare Stream / HLS delivery -->
    <link rel="preconnect" href="https://videodelivery.net" crossorigin />
    <link rel="dns-prefetch" href="https://videodelivery.net" />
    <link rel="preconnect" href="https://customer-od6lvjm5bwfl1lki.cloudflarestream.com" crossorigin />
    <!-- Google Fonts — Caveat (wordmark only). Declared here as a parallel
         <link> rather than a CSS @import so the browser can fetch it
         concurrently with the main stylesheet instead of sequentially. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" />
    <link rel="preload" href="/fonts/Nunito-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/frontend/main.tsx"></script>
  </body>
</html>
