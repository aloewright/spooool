name = "spooool"
main = "src/workers/index.ts"
compatibility_date = "2024-03-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ALO-166 / observability: persist console.log + uncaught errors in
# Cloudflare's Workers Logs store (3-day retention on the free plan;
# unlimited on Workers Paid). Without this `wrangler tail` is the only
# way to see logs and they vanish the moment you disconnect.
[observability.logs]
enabled = true
# Sample successful traffic so high-QPS routes don't dominate quota.
# Errors / non-2xx responses always log regardless of sample rate.
# Temporarily 1.0 while we debug the prompt-to-video toolchain — the
# create-cma stage logs were getting sampled out, making the worker look
# silent on every poll. Dial back to ~0.2 once /create is stable.
head_sampling_rate = 1.0

# Static Frontend Assets (built by Vite → dist/)
#
# `binding = "ASSETS"` is required for og-meta.ts and any other worker
# route that needs to fetch the SPA HTML (e.g. to HTMLRewriter-inject
# OG meta tags). Without the binding, `env.ASSETS` is undefined and
# `/watch/:id` 500s with TypeError reading 'fetch'.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /robots.txt and /sitemap.xml are dynamic worker responses; without listing
# them here the SPA fallback would shadow them with index.html.
run_worker_first = [
  "/api/*",
  "/robots.txt",
  "/sitemap.xml",
  "/sitemap-static.xml",
  "/sitemap-videos-*.xml",
  # ALO-158: intercept /watch/:id so the worker can inject per-video OG /
  # Twitter card meta tags via HTMLRewriter before serving the SPA HTML.
  "/watch/*",
]

# R2 Bucket - Video Storage
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "spooool-videos"

# R2 Bucket - Logpush sink (created via scripts/setup-logpush.sh).
# Logpush jobs themselves are account-level resources and aren't
# wrangler-managed, but the destination bucket needs to exist before
# the job is created.
[[r2_buckets]]
binding = "LOGS"
bucket_name = "spooool-logs"

# D1 Database - Metadata, Users, Comments
# Recreated 2026-05-20 as part of the cloudflare-tube → spooool rename
# (D1 has no in-place rename and `wrangler d1 export` chokes on the FTS5
# virtual table, so the prod DB was rebuilt: new DB created, migrations
# replayed, non-FTS table contents copied across).
[[d1_databases]]
binding = "DB"
database_name = "spooool-prod"
database_id = "bbdd0163-a3d8-4bc7-805a-c23d2b08d4d7"
migrations_dir = "src/db/migrations"

# KV Namespace - Cache
[[kv_namespaces]]
binding = "CACHE"
id = "3926c69276244c558e2d8aebb42c01e2"

# KV Namespace - Sessions / Multipart Upload State
[[kv_namespaces]]
binding = "SESSIONS"
id = "0b560dd1327445bd8b5eb6efca3e82e0"

# Queue - Video Encoding Pipeline
[[queues.producers]]
binding = "VIDEO_ENCODING"
queue = "video-encoding"

# Queue - AI Generative Video (ALO-647)
# Consumer must be registered server-side (not declared here — wrangler errors on
# re-declaration at deploy time). Register once with:
#   npx wrangler queues consumer add ai-gen spooool
# or via the Cloudflare dashboard, mirroring the video-encoding consumer setup.
[[queues.producers]]
binding = "AI_GEN"
queue = "ai-gen"

# Consumer is registered server-side; wrangler errors if re-declared on deploy.
# To change batch size / DLQ, edit via the Cloudflare dashboard or `wrangler queues consumer`.

# Analytics Engine — view + watch-time datapoints (ALO-144)
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "spooool_video_analytics"

# Deploy-version metadata exposed to the worker as { id, tag } so /api/health
# can report which build is live without a separate WORKER_VERSION secret.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Cloudflare Email Sending binding — transactional auth mail (verification,
# password reset, password-changed confirmation, welcome). Domain must be
# onboarded once via `npx wrangler email sending enable spooool.com` and the
# SPF / DKIM / DMARC records propagated before the first send.
[[send_email]]
name = "EMAIL"

# Workers AI binding for synthesizeTts (sub-#4). We call
# `env.AI.run("@cf/deepgram/aura-2-en", ..., { gateway: { id: 'spooool' } })`
# so the TTS audio goes through the user's `spooool` AI Gateway for
# observability + caching, while bypassing the dynamic-route fallback
# chain (which requires per-provider request shapes — see
# notes in src/workers/create-tools.ts).
[ai]
binding = "AI"

# Cloudflare Media Transformations binding (E10/E11). Used by media-transform.ts
# to extract audio for STT (captions) and for E10 video transform helpers
# (auto-poster, social crop, preview GIF, trim-to-share).
# Manual op required: enable Media Transformations on the spooool zone via the
# Cloudflare dashboard, and ensure the R2 public origin answers HEAD + range.
# Falls back gracefully to raw R2 get when absent (dev / zones without MT).
[media]
binding = "MEDIA"

# Cloudflare Stream binding (ALO-???). Used by /api/stream/upload-url to
# mint one-time direct creator upload URLs for the client without ever
# exposing CF_STREAM_API_TOKEN to the browser, and to manage video
# metadata + signed tokens from the worker. Docs:
# https://developers.cloudflare.com/stream/manage-video-library/bindings/
[stream]
binding = "STREAM"

# Durable Object — channel subscriber fan-out (ALO-156)
[[durable_objects.bindings]]
name = "CHANNEL_SUBSCRIBER_DO"
class_name = "ChannelSubscriberDO"

# Durable Object — token-bucket rate limiter (ALO-168). One DO instance per
# (bucket, identity) pair. See src/workers/rate-limit-do.ts.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

# Recorder render pipeline (sub-project #1). Per-account container that
# runs Remotion + Chromium + ffmpeg to composite recorded takes.
#
# Image is pre-built and pushed to CF's managed registry via
#   `npx wrangler containers build container/render --tag spooool-render:<ver> --push`
# because Workers Builds CI does not have Docker. Bump the version on every
# Dockerfile / container source change before deploying.
[[containers]]
class_name = "RenderContainer"
image = "registry.cloudflare.com/85d376fc54617bcb57185547f08e528b/spooool-render:1.1.0"
max_instances = 50
instance_type = "standard-4"

# Durable Object binding for the render container. CF Containers require a
# matching DO namespace registration so the worker can dispatch instances.
[[durable_objects.bindings]]
name = "RENDER_CONTAINER"
class_name = "RenderContainer"

# R2+FFmpeg HLS encoding fallback (ALO-136). Same image as RenderContainer
# (server.ts now handles both /render and /encode), separate DO class so
# encode slots are independent of render slots. Pool of ≤20 instances
# distributes encode jobs by videoId hash (see encoder-container.ts).
# Bump image version whenever container/render source changes.
[[containers]]
class_name = "EncoderContainer"
image = "registry.cloudflare.com/85d376fc54617bcb57185547f08e528b/spooool-render:1.1.0"
max_instances = 20
instance_type = "standard-4"

[[durable_objects.bindings]]
name = "ENCODE_CONTAINER"
class_name = "EncoderContainer"

# ComposerAgent DO — per-session state for guided prompt-to-video flow.
[[durable_objects.bindings]]
name = "COMPOSER_AGENT"
class_name = "ComposerAgent"

[[migrations]]
tag = "do_v1"
new_classes = ["ChannelSubscriberDO"]

[[migrations]]
tag = "do_v2"
new_classes = ["RateLimiterDO"]

[[migrations]]
tag = "do_v3"
new_sqlite_classes = ["RenderContainer"]

[[migrations]]
tag = "do_v4"
new_sqlite_classes = ["ComposerAgent"]

[[migrations]]
tag = "do_v5"
new_sqlite_classes = ["EncoderContainer"]

# Daily 02:00 UTC sweep that hard-deletes users whose 30-day GDPR grace
# window has elapsed (ALO-132), runs DMCA restore, fires cost alerts.
# The */5 cron runs the render-job timeout sweep — marks any render_job
# stuck in `rendering` for >15min as `failed`. See src/workers/render.ts.
[triggers]
crons = ["0 2 * * *", "0 8 * * *", "*/5 * * * *"]

[vars]
# YOUTUBE_API_KEY is a SECRET, not a [vars] entry. Set it with:
#   wrangler secret put YOUTUBE_API_KEY            (prod)
#   wrangler secret put YOUTUBE_API_KEY --env staging
# Used by src/workers/youtube.ts for custom multi-source feeds. TikTok needs
# no credentials (public oEmbed). Neither is a model provider, so neither
# routes through the AI Gateway.

# Comma-separated origin allow-list for CSRF protection on /api/*. Same-origin
# is always allowed in addition to whatever is listed here. Override per env.
ALLOWED_ORIGINS = ""

# Bootstrap-only admin allow-list (ALO-205). Once at least one row exists in
# the `user_roles` table with role='admin', this var is ignored — admins are
# managed via /api/admin/roles. Keep one trusted email here so a fresh deploy
# always has someone who can promote the first real admin.
ADMIN_EMAILS = "aloewright@gmail.com"

# Verified `from` address for Cloudflare Email Sending. The domain portion
# must be enabled in the dashboard / via `wrangler email sending enable`.
EMAIL_FROM = "noreply@spooool.com"
EMAIL_FROM_NAME = "Spooool"

# ALO-642/643: AI-Gateway transport mode for ai-gateway.ts. Default is
# "run-gateway" — the proven env.AI.run('@cf/..', .., { gateway: { id: 'x' } })
# path: gateway-routed/observable, byte-for-byte parity with the previous
# create-tools behavior, and it preserves the provider error message (which the
# gateway-binding adapter loses to @tanstack/ai's strip-to-spec middleware).
# Switch to "gateway-binding" to use the @cloudflare/tanstack-ai gateway-binding
# adapter once it's smoke-verified on this account (see E11 AI Studio spec, App. B).
AI_GATEWAY_MODE = "run-gateway"

# Cross-web video search / playback (src/workers/discover.ts, src/workers/cobalt.ts).
# Provider secrets (BRAVE_SEARCH_API_KEY, FIRECRAWL_API_KEY, COBALT_API_KEY) go in
# Doppler-synced Worker secrets, not here.
FIRECRAWL_URL = "https://firecrawl-cf.lazee.workers.dev"
COBALT_URL = "https://cobalt-api.lazee.workers.dev"

# Staging environment. Defined after the top-level [vars] table because TOML
# treats [env.*] tables as terminal — any top-level table (like [vars]) must be
# declared before the first [env.*] section or wrangler errors with
# "trying to redefine an already defined table".
# NOTE: an [env.*] `vars` table does NOT inherit/merge top-level [vars] —
# wrangler replaces it wholesale, so the discover/cobalt URLs must be repeated here.
[env.staging]
vars = { ALLOWED_ORIGINS = "", FIRECRAWL_URL = "https://firecrawl-cf.lazee.workers.dev", COBALT_URL = "https://cobalt-api.lazee.workers.dev" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "spooool-staging"
database_id = "1d5c2f71-57b8-45e7-8863-0b501568f5ea"
migrations_dir = "src/db/migrations"

# Secrets (set via: wrangler secret put <NAME>)
# BETTER_AUTH_SECRET      (required — random 32+ byte string for signing sessions)
# BETTER_AUTH_URL         (optional — public origin, e.g. https://spooool.workers.dev)
# GOOGLE_CLIENT_ID        (OAuth — from console.cloud.google.com → Credentials)
# GOOGLE_CLIENT_SECRET    (OAuth — paired with GOOGLE_CLIENT_ID)
# GITHUB_CLIENT_ID        (OAuth — from github.com → Settings → Developer settings → OAuth Apps)
# GITHUB_CLIENT_SECRET    (OAuth — paired with GITHUB_CLIENT_ID)
# CLOUDFLARE_ACCOUNT_ID
# CF_STREAM_API_TOKEN
# CF_STREAM_WEBHOOK_SECRET (HMAC secret to verify Cloudflare Stream webhooks)
# STREAM_ENABLED          (set to "true" to route uploads through Cloudflare Stream)
# POLAR_ACCESS_TOKEN      (Polar API token — sandbox or production)
# POLAR_WEBHOOK_SECRET    (HMAC secret to verify Polar webhook signatures)
# POLAR_CLIENT_ID         (Polar OAuth app client ID — for creator partner onboarding)
# POLAR_CLIENT_SECRET     (Polar OAuth app client secret — paired with POLAR_CLIENT_ID)
# SENTRY_DSN              (worker error tracking — get from sentry.io project settings)
# RENDER_CALLBACK_SECRET    (recorder render — random 32+ byte hex, shared with the container service)
# EMAIL_UNSUBSCRIBE_SECRET  (random 32+ byte string — HMAC key for one-click unsubscribe tokens in emails)
# CF_ACCOUNT_ID           (set: random hex from CF dashboard; needed for AI Gateway URL)
# CF_GATEWAY_ID           (e.g. "x"; the gateway slug used in CLAUDE.md)
# CF_AIG_TOKEN            (Bearer token from CF dashboard → AI → AI Gateway)
#
# Transactional email is sent via the Cloudflare `send_email` binding above
# (no API key needed). One-time setup: `npx wrangler email sending enable
# spooool.com` and verify SPF / DKIM / DMARC propagation.
#
# Frontend env vars (Doppler-injected at build time via `doppler run -- npm run build`):
# VITE_SENTRY_DSN         (same DSN — Vite exposes this to the browser bundle)
# VITE_POSTHOG_KEY        (ALO-166 — PostHog project API key, e.g. phc_...)
# VITE_POSTHOG_HOST       (ALO-166 — defaults to https://us.i.posthog.com; override for self-hosted)
