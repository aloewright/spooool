name = "spooool"
main = "src/workers/index.ts"
compatibility_date = "2024-03-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ALO-166 / observability: persist console.log + uncaught errors in
# Cloudflare's Workers Logs store (3-day retention on the free plan;
# unlimited on Workers Paid). Without this `wrangler tail` is the only
# way to see logs and they vanish the moment you disconnect.
[observability.logs]
enabled = true
# Sample successful traffic so high-QPS routes don't dominate quota.
# Errors / non-2xx responses always log regardless of sample rate.
head_sampling_rate = 0.2

# Static Frontend Assets (built by Vite → dist/)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# /robots.txt and /sitemap.xml are dynamic worker responses; without listing
# them here the SPA fallback would shadow them with index.html.
run_worker_first = [
  "/api/*",
  "/robots.txt",
  "/sitemap.xml",
  "/sitemap-static.xml",
  "/sitemap-videos-*.xml",
  # ALO-158: intercept /watch/:id so the worker can inject per-video OG /
  # Twitter card meta tags via HTMLRewriter before serving the SPA HTML.
  "/watch/*",
]

# R2 Bucket - Video Storage
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "cloudflare-tube-videos"

# R2 Bucket - Logpush sink (created via scripts/setup-logpush.sh).
# Logpush jobs themselves are account-level resources and aren't
# wrangler-managed, but the destination bucket needs to exist before
# the job is created.
[[r2_buckets]]
binding = "LOGS"
bucket_name = "cloudflare-tube-logs"

# D1 Database - Metadata, Users, Comments
[[d1_databases]]
binding = "DB"
database_name = "cloudflare-tube-prod"
database_id = "bcf1a3f9-3732-4770-aae2-774decf68171"
migrations_dir = "src/db/migrations"

# KV Namespace - Cache
[[kv_namespaces]]
binding = "CACHE"
id = "3926c69276244c558e2d8aebb42c01e2"

# KV Namespace - Sessions / Multipart Upload State
[[kv_namespaces]]
binding = "SESSIONS"
id = "0b560dd1327445bd8b5eb6efca3e82e0"

# Queue - Video Encoding Pipeline
[[queues.producers]]
binding = "VIDEO_ENCODING"
queue = "video-encoding"

# Consumer is registered server-side; wrangler errors if re-declared on deploy.
# To change batch size / DLQ, edit via the Cloudflare dashboard or `wrangler queues consumer`.

# Analytics Engine — view + watch-time datapoints (ALO-144)
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "spooool_video_analytics"

# Deploy-version metadata exposed to the worker as { id, tag } so /api/health
# can report which build is live without a separate WORKER_VERSION secret.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Durable Object — channel subscriber fan-out (ALO-156)
[[durable_objects.bindings]]
name = "CHANNEL_SUBSCRIBER_DO"
class_name = "ChannelSubscriberDO"

# Durable Object — token-bucket rate limiter (ALO-168). One DO instance per
# (bucket, identity) pair. See src/workers/rate-limit-do.ts.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "do_v1"
new_classes = ["ChannelSubscriberDO"]

[[migrations]]
tag = "do_v2"
new_classes = ["RateLimiterDO"]

# Daily 02:00 UTC sweep that hard-deletes users whose 30-day GDPR grace
# window has elapsed (ALO-132). See src/workers/account.ts -> runDeletionSweep.
[triggers]
crons = ["0 2 * * *"]

[vars]
# Comma-separated origin allow-list for CSRF protection on /api/*. Same-origin
# is always allowed in addition to whatever is listed here. Override per env.
ALLOWED_ORIGINS = ""

# Bootstrap-only admin allow-list (ALO-205). Once at least one row exists in
# the `user_roles` table with role='admin', this var is ignored — admins are
# managed via /api/admin/roles. Keep one trusted email here so a fresh deploy
# always has someone who can promote the first real admin.
ADMIN_EMAILS = "aloewright@gmail.com"

# Secrets (set via: wrangler secret put <NAME>)
# BETTER_AUTH_SECRET      (required — random 32+ byte string for signing sessions)
# BETTER_AUTH_URL         (optional — public origin, e.g. https://spooool.workers.dev)
# CLOUDFLARE_ACCOUNT_ID
# CF_STREAM_API_TOKEN
# CF_STREAM_WEBHOOK_SECRET (HMAC secret to verify Cloudflare Stream webhooks)
# STREAM_ENABLED          (set to "true" to route uploads through Cloudflare Stream)
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# SENTRY_DSN              (worker error tracking — get from sentry.io project settings)
# RESEND_API_KEY          (REST key from resend.com/api-keys; lifecycle email is fail-open without it)
# RESEND_AUDIENCE_ID      (audience to upsert contacts into; contact sync skipped without it)
# RESEND_FROM             (optional — From header, e.g. "spooool <hello@spooool.com>")
#
# Frontend env vars (Doppler-injected at build time via `doppler run -- npm run build`):
# VITE_SENTRY_DSN         (same DSN — Vite exposes this to the browser bundle)
# VITE_POSTHOG_KEY        (ALO-166 — PostHog project API key, e.g. phc_...)
# VITE_POSTHOG_HOST       (ALO-166 — defaults to https://us.i.posthog.com; override for self-hosted)
